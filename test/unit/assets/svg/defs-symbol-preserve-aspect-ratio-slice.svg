
<svg xmlns="http://www.w3.org/2000/svg"
     width="300" height="200"
     viewBox="0 0 300 200">

    <defs>
        <symbol id="slice-test"
                viewBox="0 0 100 100"
                preserveAspectRatio="xMidYMid slice">

            <rect x="0" y="0"
                  width="100" height="100"
                  fill="blue"/>

            <circle cx="50" cy="50"
                    r="20" fill="yellow"/>

        </symbol>
    </defs>

    <use href="#slice-test"
         x="50" y="50"
         width="200" height="100"/>

    <rect x="10" y="170"
          width="30" height="20"
          fill="red"/>
</svg>
