<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect x="0" y="0" width="200" height="200" fill="#f8f9fa"/>
  <!-- Overlapping primitive shapes with varying fill and stroke -->
  <rect x="20" y="20" width="110" height="110" fill="#e74c3c" stroke="#c0392b" stroke-width="4"/>
  <circle cx="120" cy="100" r="55" fill="#3498db" stroke="#2980b9" stroke-width="6"/>
  <polygon points="50,180 150,180 100,80" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/>
  <ellipse cx="70" cy="140" rx="45" ry="30" fill="#f1c40f" stroke="#f39c12" stroke-width="2"/>
</svg>
