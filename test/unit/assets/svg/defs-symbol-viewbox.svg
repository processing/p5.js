<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect x="0" y="0" width="200" height="200" fill="#c8c8c8"/>
  <defs>
    <!-- symbol with its own coordinate system via viewBox -->
    <symbol id="arrow" viewBox="0 0 100 100">
      <polygon points="50,5 95,95 50,75 5,95"
               fill="white" stroke="black" stroke-width="3"/>
    </symbol>
  </defs>
  <!-- use with explicit width/height triggers viewBox scaling -->
  <use href="#arrow" x="15"  y="15"  width="80" height="80"/>
  <use href="#arrow" x="105" y="105" width="80" height="80"/>
</svg>
