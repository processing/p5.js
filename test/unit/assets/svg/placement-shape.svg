<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Colorful placement fixture: easy to see shifts, scale changes, and alignment -->
  <!-- Grey background -->
  <rect x="0" y="0" width="200" height="200" fill="#d0d0d0"/>

  <!-- Colored quadrants -->
  <rect x="0"   y="0"   width="100" height="100" fill="#e74c3c" opacity="0.85"/>
  <rect x="100" y="0"   width="100" height="100" fill="#3498db" opacity="0.85"/>
  <rect x="0"   y="100" width="100" height="100" fill="#2ecc71" opacity="0.85"/>
  <rect x="100" y="100" width="100" height="100" fill="#f39c12" opacity="0.85"/>

  <!-- Centre cross — marks (100,100), useful for CENTER alignment -->
  <line x1="100" y1="80"  x2="100" y2="120" stroke="white" stroke-width="2"/>
  <line x1="80"  y1="100" x2="120" y2="100" stroke="white" stroke-width="2"/>

  <!-- Top-left L-marker at (0,0) — marks the CORNER origin -->
  <line x1="0" y1="0" x2="0"  y2="16" stroke="black" stroke-width="2"/>
  <line x1="0" y1="0" x2="16" y2="0"  stroke="black" stroke-width="2"/>

  <!-- Black border -->
  <rect x="0" y="0" width="200" height="200" fill="none" stroke="black" stroke-width="2"/>
</svg>
