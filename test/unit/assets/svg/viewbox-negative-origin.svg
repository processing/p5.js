<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 200 200" width="200" height="200">
  <!-- viewBox with negative x/y origin — common for centered coordinate systems -->
  <!-- Shapes are drawn relative to (-50,-50) origin -->
  <rect x="-50" y="-50" width="200" height="200" fill="#d0d0d0"/>
  <!-- Quadrants centred on (0,0) in SVG-space -->
  <rect x="-50" y="-50" width="100" height="100" fill="#e74c3c" opacity="0.85"/>
  <rect x="0"   y="-50" width="100" height="100" fill="#3498db" opacity="0.85"/>
  <rect x="-50" y="0"   width="100" height="100" fill="#2ecc71" opacity="0.85"/>
  <rect x="0"   y="0"   width="100" height="100" fill="#f39c12" opacity="0.85"/>
  <!-- Cross at SVG origin (0,0) — this is the geometric centre of the viewBox -->
  <line x1="0" y1="-15" x2="0" y2="15" stroke="white" stroke-width="2"/>
  <line x1="-15" y1="0" x2="15" y2="0" stroke="white" stroke-width="2"/>
  <!-- L-marker at top-left corner of viewBox (-50,-50) -->
  <line x1="-50" y1="-50" x2="-50" y2="-34" stroke="black" stroke-width="2"/>
  <line x1="-50" y1="-50" x2="-34" y2="-50" stroke="black" stroke-width="2"/>
  <rect x="-50" y="-50" width="200" height="200" fill="none" stroke="black" stroke-width="1.5"/>
</svg>
